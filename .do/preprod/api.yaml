# App Platform spec for the pre-production API and fake biller.
# Images come from the DigitalOcean registry; the Scala CI workflow pushes the
# `preprod` tag, and deploy_on_push redeploys on each push.
#
# Apply changes with: doctl apps update <app-id> --spec .do/preprod/api.yaml
# DATABASE_URL, ADMIN_TOKEN and ADMIN_PASSWORD are encrypted secrets set when
# the app was created. Applying this file without them clears them, so first copy their
# EV[...] values from `doctl apps spec get <app-id>` into a local copy.
name: banking-preprod-api
region: sgp
services:
  - name: api
    image:
      registry_type: DOCR
      repository: banking-api
      tag: preprod
      deploy_on_push:
        enabled: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    health_check:
      http_path: /ping
    envs:
      # banking_app's connection string for banking-preprod-db, with sslmode=require.
      # App Platform's database binding failed for this user ("database user was
      # not found", although it exists), so it is set as a secret instead. Update it
      # if the banking_app password changes.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DB_REQUIRE_POSTGRES
        scope: RUN_TIME
        value: "true"
      - key: BILLER_URL
        scope: RUN_TIME
        value: http://biller:8090
      - key: ADMIN_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
  - name: biller
    image:
      registry_type: DOCR
      repository: banking-biller
      tag: preprod
      deploy_on_push:
        enabled: true
    # Reachable only from the API, as http://biller:8090.
    internal_ports:
      - 8090
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      port: 8090
      http_path: /ping
