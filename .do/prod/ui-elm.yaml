# App Platform spec for the production customer UI (Elm port).
# Each UI is built with <base href="/"> and needs its own domain, so it is a
# separate app. Private networking only spans one app, so nginx proxies /api/*
# to the API's public URL.
#
# Apply changes with: doctl apps update <app-id> --spec .do/prod/ui-elm.yaml
name: banking-prod-ui-elm
region: sgp
services:
  - name: web
    image:
      registry_type: DOCR
      repository: banking-ui-elm
      tag: prod
      deploy_on_push:
        enabled: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    envs:
      - key: API_URL
        scope: RUN_TIME
        value: https://api.139-59-219-31.sslip.io
