# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches:
      - "main"
      - "cursor/**"
      - "feat/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Backend Tests (H2 + Postgres Testcontainers)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run all tests (H2 + Postgres via Testcontainers)
      run: sbt test
      # Optional: This step uploads information to the GitHub dependency graph and unblocking Dependabot alerts for the repository

  native-image-smoke:
    name: Native Image Smoke Test (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: banking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    # Builds the production image from Dockerfile.native, so the smoke test runs
    # exactly what gets deployed. It shares the banking-api cache scope with
    # publish-preprod-images, so that job's rebuild of the same commit is a
    # cache hit instead of a second native-image compile.
    - name: Build native API image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.native
        platforms: linux/amd64
        load: true
        tags: banking-api:ci
        cache-from: type=gha,scope=banking-api
        cache-to: type=gha,mode=max,scope=banking-api
    - name: Smoke test against Postgres
      run: |
        start_api() {
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/banking \
            -e DB_REQUIRE_POSTGRES=true \
            -e PORT=8080 \
            banking-api:ci > /dev/null
          for attempt in $(seq 1 20); do
            curl -sf http://localhost:8080/ping > /dev/null && return 0
            [ "$(docker inspect -f '{{.State.Running}}' api)" = true ] || break
            sleep 1
          done
          echo "Native image failed to start"
          docker logs api
          exit 1
        }

        start_api
        PGPASSWORD=postgres psql -h localhost -U postgres -d banking \
          -c "SELECT version, script, success FROM flyway_schema_history ORDER BY installed_rank;"
        APPLIED=$(PGPASSWORD=postgres psql -h localhost -U postgres -d banking -tA \
          -c "SELECT COUNT(*) FROM flyway_schema_history WHERE version IN ('1', '2') AND success;")
        if [ "$APPLIED" -ne 2 ]; then
          echo "Expected migrations V1 and V2 in flyway_schema_history, found $APPLIED"
          exit 1
        fi

        # A second boot against the same database must succeed: startup seeding
        # once crashed here with a duplicate key on Postgres.
        docker rm -f api > /dev/null
        start_api
        curl -sf http://localhost:8080/accounts/acc123/balance
        echo
        docker rm -f api > /dev/null

  ui-unit:
    name: ${{ matrix.app }} Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ui, admin-ui, ui-elm]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install dependencies
      working-directory: ${{ matrix.app }}
      run: bun install --frozen-lockfile
    - name: Run unit tests
      working-directory: ${{ matrix.app }}
      run: bun run test

  ui-e2e:
    name: Customer UI E2E (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The Angular app's Playwright specs run against each port of the customer UI.
        app: [ui, ui-elm]

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install customer UI dependencies
      working-directory: ui
      run: bun install --frozen-lockfile
    - name: Install ${{ matrix.app }} dependencies
      if: matrix.app != 'ui'
      working-directory: ${{ matrix.app }}
      run: bun install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: ui
      run: bunx playwright install --with-deps chromium
    - name: Run customer UI E2E tests
      working-directory: ui
      env:
        E2E_APP: ${{ matrix.app }}
      run: bun run e2e
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: customer-${{ matrix.app }}-playwright-results
        path: ui/test-results
        if-no-files-found: ignore
        retention-days: 7

  admin-e2e:
    name: Admin UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install admin UI dependencies
      working-directory: admin-ui
      run: bun install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: admin-ui
      run: bunx playwright install --with-deps chromium
    - name: Run admin UI E2E tests
      working-directory: admin-ui
      run: bun run e2e
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: admin-ui-playwright-results
        path: admin-ui/test-results
        if-no-files-found: ignore
        retention-days: 7

  # Publishes images for the DigitalOcean pre-production apps (see .do/preprod).
  # Runs only after every test job passes, and only when the repository
  # variable DO_DEPLOY is "true" and the secret DIGITALOCEAN_ACCESS_TOKEN is set.
  publish-preprod-images:
    name: Publish pre-prod image (${{ matrix.image }})
    needs: [build, native-image-smoke, ui-unit, ui-e2e, admin-e2e]
    if: >-
      vars.DO_DEPLOY == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/postgres-support-5273')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: banking-api
            dockerfile: Dockerfile.native
          - image: banking-biller
            dockerfile: Dockerfile.biller
          - image: banking-ui
            dockerfile: Dockerfile.ui
          - image: banking-admin-ui
            dockerfile: Dockerfile.admin-ui
          - image: banking-ui-elm
            dockerfile: Dockerfile.ui-elm
    env:
      REGISTRY: registry.digitalocean.com/${{ vars.DO_REGISTRY }}

    steps:
    - uses: actions/checkout@v5
    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
    - name: Log in to the DigitalOcean registry
      run: doctl registry login --expiry-seconds 1800
    - uses: docker/setup-buildx-action@v3
    # Pushing the preprod tag triggers deploy_on_push in App Platform. For
    # banking-api, native-image-smoke already built this commit into the same
    # cache scope, so this step reuses its layers.
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ matrix.image }}:preprod
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
