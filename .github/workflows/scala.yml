# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches:
      - "main"
      - "cursor/**"
      - "feat/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Backend Tests (H2 + Postgres Testcontainers)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run all tests (H2 + Postgres via Testcontainers)
      run: sbt test
      # Optional: This step uploads information to the GitHub dependency graph and unblocking Dependabot alerts for the repository

  ui-unit:
    name: ${{ matrix.app }} Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ui, admin-ui, ui-elm]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install dependencies
      working-directory: ${{ matrix.app }}
      run: bun install --frozen-lockfile
    - name: Run unit tests
      working-directory: ${{ matrix.app }}
      run: bun run test

  ui-e2e:
    name: Customer UI E2E (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The Angular app's Playwright specs run against each port of the customer UI.
        app: [ui, ui-elm]

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install customer UI dependencies
      working-directory: ui
      run: bun install --frozen-lockfile
    - name: Install ${{ matrix.app }} dependencies
      if: matrix.app != 'ui'
      working-directory: ${{ matrix.app }}
      run: bun install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: ui
      run: bunx playwright install --with-deps chromium
    - name: Run customer UI E2E tests
      working-directory: ui
      env:
        E2E_APP: ${{ matrix.app }}
      run: bun run e2e
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: customer-${{ matrix.app }}-playwright-results
        path: ui/test-results
        if-no-files-found: ignore
        retention-days: 7

  admin-e2e:
    name: Admin UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install admin UI dependencies
      working-directory: admin-ui
      run: bun install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: admin-ui
      run: bunx playwright install --with-deps chromium
    - name: Run admin UI E2E tests
      working-directory: admin-ui
      run: bun run e2e
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: admin-ui-playwright-results
        path: admin-ui/test-results
        if-no-files-found: ignore
        retention-days: 7
