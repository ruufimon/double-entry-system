# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches:
      - "main"
      - "cursor/**"
      - "feat/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Backend Tests (H2 + Postgres Testcontainers)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run all tests (H2 + Postgres via Testcontainers)
      run: sbt test
      # Optional: This step uploads information to the GitHub dependency graph and unblocking Dependabot alerts for the repository

  native-image-smoke:
    name: Native Image Smoke Test (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: banking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v5
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        native-image-job-reports: 'true'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Build staged JAR
      run: sbt stage
    - name: Build native image
      run: |
        native-image \
          --no-fallback \
          -march=compatibility \
          -H:+ReportExceptionStackTraces \
          -cp "target/out/jvm/scala-3.6.2/scalatra-ping-api/universal/stage/lib/*" \
          -o banking-api \
          com.example.Server
    - name: Smoke test against Postgres
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/banking
        DB_REQUIRE_POSTGRES: "true"
        PORT: "8080"
      run: |
        ./banking-api &
        API_PID=$!
        sleep 5
        
        if ! kill -0 $API_PID 2>/dev/null; then
          echo "Native image failed to start"
          exit 1
        fi
        
        curl -f http://localhost:8080/ping || exit 1
        
        PGPASSWORD=postgres psql -h localhost -U postgres -d banking -c "SELECT * FROM flyway_schema_history ORDER BY installed_rank;" || exit 1
        
        V1_COUNT=$(PGPASSWORD=postgres psql -h localhost -U postgres -d banking -t -c "SELECT COUNT(*) FROM flyway_schema_history WHERE version = '1';")
        V2_COUNT=$(PGPASSWORD=postgres psql -h localhost -U postgres -d banking -t -c "SELECT COUNT(*) FROM flyway_schema_history WHERE version = '2';")
        
        if [ "$V1_COUNT" -lt 1 ] || [ "$V2_COUNT" -lt 1 ]; then
          echo "Migrations V1 or V2 not found in flyway_schema_history"
          exit 1
        fi
        
        kill $API_PID

  ui-unit:
    name: ${{ matrix.app }} Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ui, admin-ui, ui-elm]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install dependencies
      working-directory: ${{ matrix.app }}
      run: bun install --frozen-lockfile
    - name: Run unit tests
      working-directory: ${{ matrix.app }}
      run: bun run test

  ui-e2e:
    name: Customer UI E2E (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The Angular app's Playwright specs run against each port of the customer UI.
        app: [ui, ui-elm]

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install customer UI dependencies
      working-directory: ui
      run: bun install --frozen-lockfile
    - name: Install ${{ matrix.app }} dependencies
      if: matrix.app != 'ui'
      working-directory: ${{ matrix.app }}
      run: bun install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: ui
      run: bunx playwright install --with-deps chromium
    - name: Run customer UI E2E tests
      working-directory: ui
      env:
        E2E_APP: ${{ matrix.app }}
      run: bun run e2e
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: customer-${{ matrix.app }}-playwright-results
        path: ui/test-results
        if-no-files-found: ignore
        retention-days: 7

  admin-e2e:
    name: Admin UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install admin UI dependencies
      working-directory: admin-ui
      run: bun install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: admin-ui
      run: bunx playwright install --with-deps chromium
    - name: Run admin UI E2E tests
      working-directory: admin-ui
      run: bun run e2e
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: admin-ui-playwright-results
        path: admin-ui/test-results
        if-no-files-found: ignore
        retention-days: 7
