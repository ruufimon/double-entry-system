name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      customer_url:
        description: Public Railway URL for the customer UI
        required: true
        default: https://ui-pre-production-8a8b.up.railway.app
        type: string
      admin_url:
        description: Public Railway URL for the admin UI
        required: true
        default: https://admin-ui-pre-production-8a8b.up.railway.app
        type: string
      include_bill_payment:
        description: Run the single-use demo bill lifecycle (requires a freshly restarted staging API)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  customer-e2e:
    name: Customer UI Staging E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.customer_url }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install customer UI dependencies
      working-directory: ui
      run: bun install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: ui
      run: bunx playwright install --with-deps chromium
    - name: Run repeatable customer UI E2E against staging
      if: ${{ !inputs.include_bill_payment }}
      working-directory: ui
      run: bun run e2e -- --grep-invert bill
    - name: Run complete customer UI E2E against fresh staging
      if: ${{ inputs.include_bill_payment }}
      working-directory: ui
      run: bun run e2e
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: customer-ui-staging-playwright-results
        path: ui/test-results
        if-no-files-found: ignore
        retention-days: 7

  admin-e2e:
    name: Admin UI Staging E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: customer-e2e
    env:
      E2E_BASE_URL: ${{ inputs.admin_url }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - name: Install admin UI dependencies
      working-directory: admin-ui
      run: bun install --frozen-lockfile
    - name: Install Playwright Chromium
      working-directory: admin-ui
      run: bunx playwright install --with-deps chromium
    - name: Run admin UI E2E against staging
      working-directory: admin-ui
      run: bun run e2e
    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: admin-ui-staging-playwright-results
        path: admin-ui/test-results
        if-no-files-found: ignore
        retention-days: 7
