# Runs the API, customer UI, and admin UI together.
# By default, the API uses H2 (in-memory database).
# To run with Postgres, start the profile AND point the API at it:
#   DATABASE_URL=postgresql://banking_user:banking_password@postgres:5432/banking \
#   DB_REQUIRE_POSTGRES=true docker compose --profile postgres up
# The password must match POSTGRES_PASSWORD below. See README "Configuration".
services:
  postgres:
    image: postgres:17-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.native
    image: banking-api:native
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your shell or .env file}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_REQUIRE_POSTGRES: ${DB_REQUIRE_POSTGRES:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: banking-ui:local
    environment:
      API_URL: http://api:8080
    ports:
      - "4200:8080"
    depends_on:
      # The distroless native image has no shell or curl for a health check,
      # and it starts in milliseconds.
      api:
        condition: service_started

  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile.admin-ui
    image: banking-admin-ui:local
    environment:
      API_URL: http://api:8080
    ports:
      - "4300:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
