# Runs the API and UI together: open http://localhost:4200
services:
  api:
    # GraalVM native build; use `build: .` and `image: banking-api:local` for the JVM image.
    build:
      context: .
      dockerfile: Dockerfile.native
    image: banking-api:native

  ui:
    build: ./ui
    image: banking-ui:local
    environment:
      API_URL: http://api:8080
    ports:
      - "4200:8080"
    depends_on:
      # The distroless native image has no shell or curl for a health check,
      # and it starts in milliseconds.
      api:
        condition: service_started
