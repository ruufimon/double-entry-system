# Only the three UIs are exposed. Hosts and TLS are filled in by each overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking
spec:
  ingressClassName: traefik
  rules:
    - host: ui.invalid
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ui, port: {number: 8080}}}}
    - host: admin.invalid
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: admin-ui, port: {number: 8080}}}}
    - host: elm.invalid
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ui-elm, port: {number: 8080}}}}
