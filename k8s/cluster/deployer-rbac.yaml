# CI deploys into preprod with this service account. It can change the app's workloads,
# services, ingress and network policies in this namespace, and nothing else: no
# secrets, no other namespaces, nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: preprod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: preprod
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, create, patch, update]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: preprod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: preprod
---
# A long-lived token for the service account, used to build the CI kubeconfig.
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: preprod
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
---
