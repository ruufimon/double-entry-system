apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-money-slo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  money-slo.json: |
    {
      "uid": "money-slo",
      "title": "Money SLO",
      "description": "Money-class SLO: availability, error budget, burn rate, and the signals that explain a burn. See spec/MonitoringSLO.md.",
      "tags": [
        "slo",
        "banking-api",
        "money"
      ],
      "timezone": "Asia/Bangkok",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "links": [
        {
          "type": "link",
          "title": "SLO spec",
          "url": "https://github.com/ruufimon/double-entry-system/blob/main/spec/MonitoringSLO.md",
          "targetBlank": true,
          "icon": "doc"
        }
      ],
      "annotations": {
        "list": []
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "options": []
          },
          {
            "name": "env",
            "label": "Environment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(up{job=\"api\"}, env)",
              "refId": "env"
            },
            "definition": "label_values(up{job=\"api\"}, env)",
            "current": {
              "selected": true,
              "text": "prod",
              "value": "prod"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability (30d)",
          "description": "Money-class availability over the rolling 30-day window (slo:money_availability:ratio_30d). SLO target 99.9%; red below target.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.999
                  }
                ]
              },
              "mappings": [],
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "slo:money_availability:ratio_30d{env=\"$env\"}",
              "legendFormat": "availability",
              "instant": true,
              "range": false
            }
          ],
          "links": [
            {
              "title": "Money SLO spec",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/spec/MonitoringSLO.md",
              "targetBlank": true
            },
            {
              "title": "Runbook: money availability burn",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/docs/runbooks/money-availability-burn.md",
              "targetBlank": true
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error budget remaining",
          "description": "Share of the 30-day money error budget (0.1%) left. 100% = untouched, 0% = exhausted, negative = overspent. Below 25% feature deploys stop (see spec).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "mappings": [],
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "slo:money_error_budget_remaining:ratio{env=\"$env\"}",
              "legendFormat": "budget remaining",
              "instant": true,
              "range": false
            }
          ],
          "links": [
            {
              "title": "Money SLO spec",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/spec/MonitoringSLO.md",
              "targetBlank": true
            },
            {
              "title": "Runbook: money availability burn",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/docs/runbooks/money-availability-burn.md",
              "targetBlank": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Ledger unbalanced transactions",
          "description": "Transactions whose debits and credits do not sum to zero, from the scheduled ledger check. Must be 0; any value above 0 pages immediately. -1 means no check has run yet.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "no check yet",
                      "color": "blue",
                      "index": 0
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "max(banking_ledger_unbalanced_transactions{env=\"$env\"})",
              "legendFormat": "unbalanced",
              "instant": true,
              "range": false
            }
          ],
          "links": [
            {
              "title": "Money SLO spec",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/spec/MonitoringSLO.md",
              "targetBlank": true
            },
            {
              "title": "Runbook: ledger unbalanced",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/docs/runbooks/ledger-unbalanced.md",
              "targetBlank": true
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Ledger check results",
          "description": "Ledger balance check runs per minute by result (ok, skipped, failed), summed over pods. Failed or only-skipped runs mean the unbalanced gauge is stale.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "ok"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "skipped"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "failed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "sum by (result) (rate(banking_ledger_check_duration_seconds_count{env=\"$env\"}[5m])) * 60",
              "legendFormat": "{{result}}",
              "range": true
            }
          ],
          "links": [
            {
              "title": "Money SLO spec",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/spec/MonitoringSLO.md",
              "targetBlank": true
            },
            {
              "title": "Runbook: ledger unbalanced",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/docs/runbooks/ledger-unbalanced.md",
              "targetBlank": true
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Burn rate (1h, 6h)",
          "description": "Money error budget burn rate = error ratio / 0.001. 1x spends the budget exactly in 30 days. Page thresholds: 14.4x over 1h, 6x over 6h (each also needs its short window).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "x",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "slo:money_error_ratio:rate1h{env=\"$env\"} / 0.001",
              "legendFormat": "1h",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "slo:money_error_ratio:rate6h{env=\"$env\"} / 0.001",
              "legendFormat": "6h",
              "range": true
            }
          ],
          "links": [
            {
              "title": "Money SLO spec",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/spec/MonitoringSLO.md",
              "targetBlank": true
            },
            {
              "title": "Runbook: money availability burn",
              "url": "https://github.com/ruufimon/double-entry-system/blob/main/docs/runbooks/money-availability-burn.md",
              "targetBlank": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Money request rate by outcome",
          "description": "Requests per second for class=money, stacked by outcome. dependency, misconfigured and error count against the budget; success and rejected do not.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 30,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "success"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "rejected"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "dependency"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "misconfigured"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "error"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "sum by (outcome) (rate(http_server_requests_seconds_count{env=\"$env\",class=\"money\"}[5m]))",
              "legendFormat": "{{outcome}}",
              "range": true
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latency p95 by class",
          "description": "95th percentile server latency for read, money and bill classes, from http_server_requests_seconds_bucket over 5m.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, class) (rate(http_server_requests_seconds_bucket{env=\"$env\",class=~\"read|money|bill\"}[5m])))",
              "legendFormat": "{{class}}",
              "range": true
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Latency p99 by class",
          "description": "99th percentile server latency for read, money and bill classes, from http_server_requests_seconds_bucket over 5m.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum by (le, class) (rate(http_server_requests_seconds_bucket{env=\"$env\",class=~\"read|money|bill\"}[5m])))",
              "legendFormat": "{{class}}",
              "range": true
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Hikari pool (banking)",
          "description": "Connections in the banking Hikari pool, summed over pods: active, idle, pending (threads waiting) and max. Pending above 0 with active at max means pool exhaustion.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "max"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "sum(hikaricp_connections_active{pool=\"banking\",env=\"$env\"})",
              "legendFormat": "active",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "sum(hikaricp_connections_idle{pool=\"banking\",env=\"$env\"})",
              "legendFormat": "idle",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "C",
              "expr": "sum(hikaricp_connections_pending{pool=\"banking\",env=\"$env\"})",
              "legendFormat": "pending",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "D",
              "expr": "sum(hikaricp_connections_max{pool=\"banking\",env=\"$env\"})",
              "legendFormat": "max",
              "range": true
            }
          ]
        }
      ]
    }
