apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: app.139-59-219-31.sslip.io
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ui, port: {number: 8080}}}}
    - host: admin.139-59-219-31.sslip.io
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: admin-ui, port: {number: 8080}}}}
    - host: elm.139-59-219-31.sslip.io
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ui-elm, port: {number: 8080}}}}
  tls:
    - secretName: banking-tls
      hosts:
        - app.139-59-219-31.sslip.io
        - admin.139-59-219-31.sslip.io
        - elm.139-59-219-31.sslip.io
