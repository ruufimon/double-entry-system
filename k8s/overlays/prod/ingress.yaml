apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: ui.prod.invalid
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ui, port: {number: 8080}}}}
    - host: admin.prod.invalid
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: admin-ui, port: {number: 8080}}}}
    - host: elm.prod.invalid
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ui-elm, port: {number: 8080}}}}
  tls:
    - secretName: banking-tls
      hosts:
        - ui.prod.invalid
        - admin.prod.invalid
        - elm.prod.invalid
