# Production. The hosts are sslip.io names for the load balancer's IP until there is
# a real domain: change the three hosts in ingress.yaml to switch.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  # Temporary, until 2026-11-10; see the file.
  - transition-api.yaml
# CI replaces newTag with the commit being deployed. Do not use mutable tags for rollbacks.
images:
  - name: registry.digitalocean.com/double-entry-banking/banking-api
    newTag: prod
  - name: registry.digitalocean.com/double-entry-banking/banking-biller
    newTag: prod
  - name: registry.digitalocean.com/double-entry-banking/banking-ui
    newTag: prod
  - name: registry.digitalocean.com/double-entry-banking/banking-admin-ui
    newTag: prod
  - name: registry.digitalocean.com/double-entry-banking/banking-ui-elm
    newTag: prod
patches:
  - path: ingress.yaml
  - target:
      kind: Deployment
      name: ui
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://api.prod.svc.cluster.local:8080
  - target:
      kind: Deployment
      name: admin-ui
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://api.prod.svc.cluster.local:8080
  - target:
      kind: Deployment
      name: ui-elm
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://api.prod.svc.cluster.local:8080
