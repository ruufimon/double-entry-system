# TEMPORARY, until 2026-11-10: a public host for the API, so the old App Platform UI
# apps (banking-prod-ui, -admin-ui, -ui-elm) keep working while users move to the new
# URLs. App Platform's API was public in the same way. Delete this file, its entry in
# kustomization.yaml and those three apps together.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transition-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: api.139-59-219-31.sslip.io
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: api, port: {number: 8080}}}}
  tls:
    - secretName: transition-api-tls
      hosts:
        - api.139-59-219-31.sslip.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-api-transition
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 8080, protocol: TCP}
