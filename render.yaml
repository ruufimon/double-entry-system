# Render Blueprint: https://render.com/docs/blueprint-spec
#
# The API keeps all accounts and ledger entries in memory, so it must run as a
# single instance; every deploy or restart resets the data.
services:
  - type: web
    name: banking-api
    runtime: docker
    # GraalVM native build: needs about 3 GB of RAM and a few minutes to build.
    dockerfilePath: ./Dockerfile.native
    dockerContext: .
    plan: starter
    numInstances: 1
    healthCheckPath: /ping
    autoDeploy: true
    buildFilter:
      paths:
        - build.sbt
        - project/**
        - src/main/**
        - Dockerfile.native

  - type: web
    name: banking-ui
    runtime: static
    rootDir: ui
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: dist/banking-ui/browser
    autoDeploy: true
    buildFilter:
      paths:
        - ui/**
    envVars:
      # Bun installs and runs scripts; the Angular CLI still needs Node 22+.
      - key: BUN_VERSION
        value: "1.3.14"
      - key: NODE_VERSION
        value: "24"
    routes:
      # Replaces the Angular dev-server proxy (ui/proxy.conf.json).
      # Update the host if Render assigns the API a different onrender.com URL.
      - type: rewrite
        source: /api/*
        destination: https://banking-api.onrender.com/*
      # Let Angular handle deep links such as /accounts/:accountId.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: banking-admin-ui
    runtime: static
    rootDir: admin-ui
    buildCommand: bun install --frozen-lockfile && bun run build
    staticPublishPath: dist/banking-admin-ui/browser
    autoDeploy: true
    buildFilter:
      paths:
        - admin-ui/**
    envVars:
      - key: BUN_VERSION
        value: "1.3.14"
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://banking-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
